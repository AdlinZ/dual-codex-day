name: dual-codex-day

services:
  dashboard:
    build:
      context: .
    image: dual-codex-day:0.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEX_DAY_PORT:-8765}:8765"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CODEX_DAY_RETENTION_DAYS: "${CODEX_DAY_RETENTION_DAYS:-all}"
    volumes:
      - type: bind
        source: "${CODEX_DATA_DIR:?Set CODEX_DATA_DIR to your local .codex directory}"
        target: /codex
        read_only: true
      - type: volume
        source: index
        target: /data

volumes:
  index:
