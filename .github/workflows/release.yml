name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  windows-package:
    name: Package and smoke test Windows app
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:electron
      - name: Launch packaged app and capture smoke screenshot
        shell: pwsh
        run: |
          node .\scripts\capture-electron.mjs .\dist\windows-package-smoke.png .\dist\electron\dual-codex-day-win32-x64\dual-codex-day.exe --view=work-combinations
          $image = Get-Item -LiteralPath .\dist\windows-package-smoke.png
          if ($image.Length -lt 50000) { throw 'Packaged Electron smoke screenshot is incomplete.' }
      - name: Create Windows release archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\electron\dual-codex-day-win32-x64 -DestinationPath .\dist\dual-codex-day-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/dual-codex-day-windows-x64.zip
          if-no-files-found: error

  release:
    name: Validate and release
    needs: windows-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify generated files are current
        run: git diff --exit-code -- demo/index.html src/token-dashboard.css
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/adlinz/dual-codex-day
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify anonymous image access
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/adlinz/dual-codex-day:${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          artifact="dist/dual-codex-day-windows-x64.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$artifact" --clobber
          elif [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" "$artifact" --verify-tag --latest --title "Dual Codex Day ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" "$artifact" --verify-tag --latest --title "Dual Codex Day ${GITHUB_REF_NAME}" --generate-notes
          fi
