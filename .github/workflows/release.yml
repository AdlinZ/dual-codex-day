name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify generated files are current
        run: git diff --exit-code -- demo/index.html src/token-dashboard.css
      - name: Build Docker image
        run: docker build --tag "codex-day:${GITHUB_REF_NAME}" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          elif [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --latest --title "codex-day ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --latest --title "codex-day ${GITHUB_REF_NAME}" --generate-notes
          fi
